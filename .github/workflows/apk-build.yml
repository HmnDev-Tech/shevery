name: Build Android APK

on:
  push:
    branches: [ "main", "dev", "nightly" ]
  pull_request:
    branches: [ "main", "dev", "nightly" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        required: false
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      TRUSTED_CONTEXT: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Determine build type
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "debug" ]; then
            echo "build_type=debug" >> "$GITHUB_ENV"
          else
            echo "build_type=release" >> "$GITHUB_ENV"
          fi

      - name: Configure signing
        if: env.TRUSTED_CONTEXT == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets are not configured - the APK falls back to debug signing."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > key.jks
          {
            printf 'KEYSTORE_FILE=key.jks\n'
            printf 'KEYSTORE_PASSWORD=%s\n' "$SIGNING_STORE_PASSWORD"
            printf 'KEYSTORE_ALIAS=%s\n' "$SIGNING_KEY_ALIAS"
            printf 'KEYSTORE_ALIAS_PASSWORD=%s\n' "$SIGNING_KEY_PASSWORD"
          } > signing.properties

      - name: Generate random debug keystore
        if: env.build_type == 'release' && (env.TRUSTED_CONTEXT != 'true' || env.HAS_KEYSTORE != 'true')
        run: |
          mkdir -p ~/.config/.android
          keytool -genkeypair -v -keystore ~/.config/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Build APK (standard only, stealth is generated on-device)
        run: |
          chmod +x gradlew gradlew.bin 2>/dev/null || true
          ./gradlew :manager:assembleStandard${{ env.build_type == 'release' && 'Release' || 'Debug' }}

      - name: Verify APK signature
        if: env.build_type == 'release'
        run: |
          APK=$(ls manager/build/outputs/apk/standard/release/*.apk | head -n1)
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK Artifact (standard only, no System Toolkit publish)
        uses: actions/upload-artifact@v7
        with:
          name: shevery-${{ env.build_type }}
          path: manager/build/outputs/apk/standard/${{ env.build_type }}/*.apk
