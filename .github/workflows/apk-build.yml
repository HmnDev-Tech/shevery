name: Build Android APK

on:
  push:
    branches: [ "main", "dev", "nightly" ]
  pull_request:
    branches: [ "main", "dev", "nightly" ]
  workflow_dispatch:

# Every run builds and uploads BOTH artifacts: a debug APK and a release APK.
# There is no debug-or-release choice - each run always produces the pair.

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      TRUSTED_CONTEXT: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Configure signing
        if: env.TRUSTED_CONTEXT == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets are not configured - the APK falls back to debug signing."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > key.jks
          {
            printf 'KEYSTORE_FILE=key.jks\n'
            printf 'KEYSTORE_PASSWORD=%s\n' "$SIGNING_STORE_PASSWORD"
            printf 'KEYSTORE_ALIAS=%s\n' "$SIGNING_KEY_ALIAS"
            printf 'KEYSTORE_ALIAS_PASSWORD=%s\n' "$SIGNING_KEY_PASSWORD"
          } > signing.properties

      - name: Generate random debug keystore
        if: env.TRUSTED_CONTEXT != 'true' || env.HAS_KEYSTORE != 'true'
        run: |
          mkdir -p ~/.config/.android
          keytool -genkeypair -v -keystore ~/.config/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Build debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew :manager:assembleDebug

      - name: Build release APK
        run: ./gradlew :manager:assembleRelease

      - name: Verify APK signature
        run: |
          APK=$(ls manager/build/outputs/apk/release/*.apk | head -n1)
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: shevery-debug
          path: manager/build/outputs/apk/debug/*.apk

      - name: Upload release APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: shevery-release
          path: manager/build/outputs/apk/release/*.apk
