plugins {
    id("idea")
}

idea.module {
    excludeDirs += file('out')
}

subprojects {
    plugins.withId("com.android.base") {
        android {
            compileSdk = 37
            buildToolsVersion = "37.0.0"
            ndkVersion = "29.0.14206865"
            defaultConfig {
                minSdk = 24
                targetSdk = 37
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

def apiManifest = file('api/manifest.gradle')
def localPropsFile = file('local.properties')
if (localPropsFile.canRead()) {
    def localProps = new Properties()
    localProps.load(new FileInputStream(localPropsFile))
    if (localProps['api.useLocal'] == 'true' && localProps['api.dir']) {
        def candidate = file("${localProps['api.dir']}/manifest.gradle")
        if (candidate.exists()) {
            apiManifest = candidate
        }
    }
}
if (apiManifest.exists()) {
    apply from: apiManifest
} else {
    ext {
        api_version_major = 14
        api_version_minor = 6
        api_version_patch = 1
        api_version_name = "${api_version_major}.${api_version_minor}.${api_version_patch}"
    }
}
def gitCommitId = "dev"
try {
    def commit = 'git rev-parse --short HEAD'.execute([], project.rootDir).text.trim()
    if (!commit.isEmpty()) gitCommitId = commit
} catch (Exception ignored) {}

def gitCommitCount = 48

def baseVersionName = "${api_version_name}"
ext {
    versionCode = gitCommitCount
    versionName = "${baseVersionName}"
}
